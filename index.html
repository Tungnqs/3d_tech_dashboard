<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Pulse 3D</title>
  <meta name="description" content="Interactive 3D technology dashboard built with plain HTML, CSS and JavaScript.">
  <link rel="stylesheet" href="style.css">
</head>
<body data-palette="#3987e5,#d95926,#199e70">

  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Tech Pulse</h1>
        <p class="sub">Global technology signal · live</p>
      </div>
    </div>

    <div class="filters" role="group" aria-label="Filters">
      <div class="segmented" role="radiogroup" aria-label="Time range" id="rangeControl">
        <button type="button" role="radio" aria-checked="false" data-range="24h">24h</button>
        <button type="button" role="radio" aria-checked="true"  data-range="7d">7d</button>
        <button type="button" role="radio" aria-checked="false" data-range="30d">30d</button>
      </div>
      <label class="select-wrap">
        <span class="visually-hidden">Technology</span>
        <select id="techSelect" aria-label="Technology filter">
          <option value="all">All technologies</option>
        </select>
      </label>
      <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <div class="clock" id="clock" aria-live="off">--:--:--</div>
    </div>
  </header>

  <main class="grid">

    <!-- KPI tiles -->
    <section class="kpis" aria-label="Key metrics" id="kpis"></section>

    <!-- 3D sphere -->
    <section class="card card-3d span-2 tall" id="sphereCard">
      <div class="card-head">
        <div>
          <h2>Technology network</h2>
          <p class="hint">Drag to rotate · hover a node · click to focus</p>
        </div>
        <div class="card-actions">
          <button type="button" class="chip" id="autoRotate" aria-pressed="true">Auto-rotate</button>
          <button type="button" class="chip" id="resetFocus">Show all</button>
        </div>
      </div>
      <div class="sphere-wrap">
        <canvas id="sphere" role="img" aria-label="Rotating 3D network of technology nodes"></canvas>
        <div class="tooltip" id="sphereTip" role="tooltip" hidden></div>
      </div>
      <div class="legend" id="sphereLegend"></div>
    </section>

    <!-- 3D bars -->
    <section class="card card-3d tall" id="barsCard">
      <div class="card-head">
        <div>
          <h2 id="barsTitle">Adoption index</h2>
          <p class="hint">Drag to orbit</p>
        </div>
        <div class="segmented small" role="radiogroup" aria-label="Bar metric" id="metricControl">
          <button type="button" role="radio" aria-checked="true"  data-metric="adoption">Adoption</button>
          <button type="button" role="radio" aria-checked="false" data-metric="investment">Investment</button>
        </div>
      </div>
      <div class="bars-stage" id="barsStage">
        <div class="bars-scene" id="barsScene">
          <div class="bars-floor" aria-hidden="true"></div>
          <div class="bars-row" id="barsRow"></div>
        </div>
        <div class="tooltip" id="barsTip" role="tooltip" hidden></div>
      </div>
    </section>

    <!-- Line chart -->
    <section class="card card-3d span-2" id="lineCard">
      <div class="card-head">
        <div>
          <h2 id="lineTitle">Workload throughput</h2>
          <p class="hint" id="lineHint">Requests per second, last 7 days</p>
        </div>
        <div class="card-actions">
          <div class="legend" id="lineLegend"></div>
          <button type="button" class="chip" id="tableToggle" aria-pressed="false">Table</button>
        </div>
      </div>
      <div class="line-wrap" id="lineWrap">
        <svg id="lineChart" role="img" aria-labelledby="lineTitle"></svg>
        <div class="tooltip" id="lineTip" role="tooltip" hidden></div>
      </div>
      <div class="table-wrap" id="lineTable" hidden></div>
    </section>

    <!-- Event feed -->
    <section class="card card-3d" id="feedCard">
      <div class="card-head">
        <div>
          <h2>Event stream</h2>
          <p class="hint">Live status changes</p>
        </div>
        <span class="pulse" aria-hidden="true"></span>
      </div>
      <ul class="feed" id="feed" aria-live="polite" aria-relevant="additions"></ul>
    </section>

  </main>

  <footer class="foot">
    <span>Sample data, generated locally · no network calls</span>
    <span id="fps" aria-label="Frame rate"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
