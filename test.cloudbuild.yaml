# Cloud Build CI/CD: build Docker image -> push to Artifact Registry -> deploy to Cloud Run
# Project : lixil-lec-dev
# Image   : ${_AR_HOST}/lixil-lec-dev/lixil-dev-fe-ar/test-ci-cd:<commit sha>
# Service : fe-ci-cd-test-cr

substitutions:
  _REGION: asia-southeast1                       # Cloud Run + Artifact Registry region
  _AR_HOST: asia-southeast1-docker.pkg.dev       # Artifact Registry host for that region
  _AR_REPO: lixil-dev-fe-ar
  _IMAGE_NAME: test-ci-cd
  _SERVICE: fe-ci-cd-test-cr
  _IMAGE: ${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}

steps:
  # 1. Pull the previous image so Docker can reuse layers (speeds up builds; ignored on first run)
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_IMAGE}:latest || exit 0']

  # 2. Build the image, tagged with the commit SHA and "latest"
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=${_IMAGE}:latest
      - --tag=${_IMAGE}:${COMMIT_SHA}
      - --tag=${_IMAGE}:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=ASSET_VERSION=${SHORT_SHA}
      - .
    env:
      - DOCKER_BUILDKIT=1

  # 3. Push both tags to Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  # 4. Deploy the freshly built image to Cloud Run (automatic on every trigger run)
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet
      - --labels=commit-sha=${SHORT_SHA},managed-by=cloud-build

# Lets Cloud Build report the artifacts it produced
images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

timeout: 1200s
